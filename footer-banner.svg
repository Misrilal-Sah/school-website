<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80">
  <!-- Background -->
  <rect width="900" height="80" fill="#0f2341" rx="10"/>

  <!-- Inner border -->
  <rect x="10" y="10" width="880" height="60" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.3" rx="6"/>

  <!-- Top rule -->
  <line x1="40" y1="26" x2="860" y2="26" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Bottom rule -->
  <line x1="40" y1="54" x2="860" y2="54" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Corner diamonds -->
  <text x="26"  y="30" fill="#f59e0b" font-size="11" font-family="serif" opacity="0.8">✦</text>
  <text x="857" y="30" fill="#f59e0b" font-size="11" font-family="serif" opacity="0.8">✦</text>
  <text x="26"  y="58" fill="#f59e0b" font-size="11" font-family="serif" opacity="0.8">✦</text>
  <text x="857" y="58" fill="#f59e0b" font-size="11" font-family="serif" opacity="0.8">✦</text>

  <!-- Footer text -->
  <text x="450" y="44"
        fill="#ffffff"
        font-size="15"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        letter-spacing="3">☀  Sunrise Academy — Est. 1985  ☀</text>
</svg>
