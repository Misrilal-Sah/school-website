<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190">
  <!-- Background -->
  <rect width="900" height="190" fill="#0f2341" rx="14"/>

  <!-- Subtle inner border -->
  <rect x="14" y="14" width="872" height="162" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.35" rx="8"/>

  <!-- Top decorative rule -->
  <line x1="50" y1="44" x2="850" y2="44" stroke="#f59e0b" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- Bottom decorative rule -->
  <line x1="50" y1="148" x2="850" y2="148" stroke="#f59e0b" stroke-width="0.9" stroke-opacity="0.55"/>

  <!-- Corner diamonds -->
  <text x="33"  y="50"  fill="#f59e0b" font-size="15" font-family="serif" opacity="0.85">✦</text>
  <text x="848" y="50"  fill="#f59e0b" font-size="15" font-family="serif" opacity="0.85">✦</text>
  <text x="33"  y="154" fill="#f59e0b" font-size="15" font-family="serif" opacity="0.85">✦</text>
  <text x="848" y="154" fill="#f59e0b" font-size="15" font-family="serif" opacity="0.85">✦</text>

  <!-- Sun icon -->
  <text x="450" y="88" fill="#f59e0b" font-size="30" text-anchor="middle" font-family="serif">☀</text>

  <!-- School name -->
  <text x="450" y="122"
        fill="#ffffff"
        font-size="32"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700"
        letter-spacing="8">SUNRISE ACADEMY</text>

  <!-- Tagline -->
  <text x="450" y="143"
        fill="#14b8a6"
        font-size="13"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        letter-spacing="2.5">Nurturing Minds  ·  Shaping Futures  ·  Est. 1985</text>
</svg>
